<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ratings - SkillHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ratings.css">
</head>
	<style>.ratings-container {
  max-width: 800px;
  margin: 2rem auto;
  padding: 2rem;
  background: var(--white);
  border-radius: var(--border-radius);
  box-shadow: var(--box-shadow);
}

.ratings-summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--light-gray);
}

.overall-rating {
  text-align: center;
  padding: 1rem;
}

.overall-rating h2 {
  font-size: 2.5rem;
  margin: 0.5rem 0;
}

.overall-rating h2 small {
  font-size: 1rem;
  color: var(--muted);
}

.rating-stars {
  font-size: 1.5rem;
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.rating-stars i {
  margin: 0 0.1rem;
}

.rating-stats {
  flex: 1;
  padding: 0 2rem;
}

.stat-item {
  display: flex;
  align-items: center;
  margin-bottom: 1rem;
}

.stat-item label {
  width: 120px;
  font-weight: 600;
}

.stat-bar {
  flex: 1;
  height: 8px;
  background: var(--light-gray);
  border-radius: 4px;
  margin: 0 1rem;
  overflow: hidden;
}

.stat-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 4px;
}

.stat-item span {
  width: 40px;
  text-align: right;
  font-weight: 600;
}

.review-card {
  background: var(--white);
  border-radius: var(--border-radius);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.review-header {
  display: flex;
  align-items: center;
  margin-bottom: 1rem;
}

.review-header img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  margin-right: 1rem;
  object-fit: cover;
}

.review-user h4 {
  margin-bottom: 0.2rem;
}

.review-date {
  color: var(--muted);
  font-size: 0.9rem;
}

.review-rating {
  color: var(--primary);
  margin-left: auto;
}

.review-content {
  line-height: 1.6;
}

@media (max-width: 768px) {
  .ratings-summary {
    flex-direction: column;
  }
  
  .rating-stats {
    width: 100%;
    padding: 1rem 0;
  }
}</style>
<body>
  <header>
    <div class="container nav">
      <div class="brand"><div class="logo">S</div>SkillHub</div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="feed.html">Feed</a></li>
        </ul>
      </nav>
      <div class="auth">
        <!-- Filled by main.js -->
      </div>
    </div>
  </header>

  <main class="container">
    <div class="ratings-container">
      <h1>Your Ratings</h1>
      
      <div class="ratings-summary">
        <div class="overall-rating">
          <div class="rating-stars">
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
            <i class="fas fa-star-half-alt"></i>
          </div>
          <h2>4.2 <small>/ 5.0</small></h2>
          <p>Based on 15 reviews</p>
        </div>
		  
		  <div class="ratings-container">
      <div class="ratings-header">
        <h1>Rate Professionals</h1>
        <div class="search-box">
          <input type="text" placeholder="Search professionals..." id="searchProfessionals">
          <i class="fas fa-search"></i>
        </div>
      </div>
      
      <div class="professionals-list" id="professionalsList">
        <!-- Professionals to rate will be loaded here -->
      </div>
      
      <div class="rating-modal" id="ratingModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Rate <span id="rateUserName"></span></h3>
            <button class="close-modal">&times;</button>
          </div>
          <div class="modal-body">
            <div class="rating-stars">
              <i class="far fa-star" data-rating="1"></i>
              <i class="far fa-star" data-rating="2"></i>
              <i class="far fa-star" data-rating="3"></i>
              <i class="far fa-star" data-rating="4"></i>
              <i class="far fa-star" data-rating="5"></i>
            </div>
            <div class="rating-categories">
              <div class="category">
                <label>Professionalism</label>
                <div class="stars">
                  <i class="far fa-star" data-category="professionalism" data-rating="1"></i>
                  <i class="far fa-star" data-category="professionalism" data-rating="2"></i>
                  <i class="far fa-star" data-category="professionalism" data-rating="3"></i>
                  <i class="far fa-star" data-category="professionalism" data-rating="4"></i>
                  <i class="far fa-star" data-category="professionalism" data-rating="5"></i>
                </div>
              </div>
              <div class="category">
                <label>Quality</label>
                <div class="stars">
                  <i class="far fa-star" data-category="quality" data-rating="1"></i>
                  <i class="far fa-star" data-category="quality" data-rating="2"></i>
                  <i class="far fa-star" data-category="quality" data-rating="3"></i>
                  <i class="far fa-star" data-category="quality" data-rating="4"></i>
                  <i class="far fa-star" data-category="quality" data-rating="5"></i>
                </div>
              </div>
              <div class="category">
                <label>Communication</label>
                <div class="stars">
                  <i class="far fa-star" data-category="communication" data-rating="1"></i>
                  <i class="far fa-star" data-category="communication" data-rating="2"></i>
                  <i class="far fa-star" data-category="communication" data-rating="3"></i>
                  <i class="far fa-star" data-category="communication" data-rating="4"></i>
                  <i class="far fa-star" data-category="communication" data-rating="5"></i>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label for="reviewText">Your Review</label>
              <textarea id="reviewText" rows="4" placeholder="Share your experience..."></textarea>
            </div>
            <button class="btn btn-primary" id="submitRatingBtn">Submit Rating</button>
          </div>
        </div>
      </div>
    </div>
        
        <div class="rating-stats">
          <div class="stat-item">
            <label>Professionalism</label>
            <div class="stat-bar">
              <div class="stat-fill" style="width: 90%"></div>
            </div>
            <span>4.5</span>
          </div>
          
          <div class="stat-item">
            <label>Quality</label>
            <div class="stat-bar">
              <div class="stat-fill" style="width: 85%"></div>
            </div>
            <span>4.3</span>
          </div>
          
          <div class="stat-item">
            <label>Communication</label>
            <div class="stat-bar">
              <div class="stat-fill" style="width: 95%"></div>
            </div>
            <span>4.8</span>
          </div>
        </div>
      </div>
      
      <div class="reviews-list" id="reviewsList">
        <!-- Reviews will be loaded here -->
      </div>
    </div>
  </main>

  <script src="js/main.js">// Mobile menu toggle
document.addEventListener('DOMContentLoaded', function() {
  const mobileToggle = document.getElementById('mobileToggle');
  if (mobileToggle) {
    mobileToggle.addEventListener('click', function() {
      const menu = document.getElementById('mobileMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      this.setAttribute('aria-expanded', menu.style.display === 'block');
    });
  }

  // Check authentication state
  const currentUser = JSON.parse(localStorage.getItem('currentUser'));
  const authLinks = document.querySelector('.auth');
  
  if (currentUser && authLinks) {
    authLinks.innerHTML = `
      <a href="profile.html" class="user-avatar">
        <img src="${currentUser.avatar}" alt="${currentUser.name}">
      </a>
      <button id="logoutBtn" class="btn btn-outline">Logout</button>
    `;
    
    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    });
  }
});</script>
  <script src="js/ratings.js">document.addEventListener('DOMContentLoaded', function() {
  // Check authentication
  const currentUser = JSON.parse(localStorage.getItem('currentUser'));
  if (!currentUser) {
    window.location.href = 'login.html';
    return;
  }

  // Sample reviews data
  const reviews = [
    {
      id: 'rev1',
      user: {
        name: 'Sarah Johnson',
        avatar: 'https://i.pravatar.cc/150?u=client1'
      },
      date: '2 weeks ago',
      rating: 5,
      title: 'Excellent work!',
      content: 'John did an amazing job fixing our plumbing issues. He was punctual, professional, and the quality of work was outstanding. Highly recommend!',
      categories: {
        professionalism: 5,
        quality: 5,
        communication: 5
      }
    },
    {
      id: 'rev2',
      user: {
        name: 'Michael Brown',
        avatar: 'https://i.pravatar.cc/150?u=client2'
      },
      date: '1 month ago',
      rating: 4,
      title: 'Great service',
      content: 'Very satisfied with the service. The only reason I\'m not giving 5 stars is because the job took a bit longer than estimated, but the results were perfect.',
      categories: {
        professionalism: 4,
        quality: 5,
        communication: 4
      }
    },
    // More reviews...
  ];

  // Calculate average ratings
  function calculateAverages() {
    const avg = {
      overall: 0,
      professionalism: 0,
      quality: 0,
      communication: 0
    };
    
    if (reviews.length === 0) return avg;
    
    reviews.forEach(review => {
      avg.overall += review.rating;
      avg.professionalism += review.categories.professionalism;
      avg.quality += review.categories.quality;
      avg.communication += review.categories.communication;
    });
    
    avg.overall = (avg.overall / reviews.length).toFixed(1);
    avg.professionalism = (avg.professionalism / reviews.length).toFixed(1);
    avg.quality = (avg.quality / reviews.length).toFixed(1);
    avg.communication = (avg.communication / reviews.length).toFixed(1);
    
    return avg;
  }
  
  // Render reviews
  const reviewsList = document.getElementById('reviewsList');
  
  function renderReviews() {
    const averages = calculateAverages();
    
    // Update summary
    document.querySelector('.overall-rating h2').textContent = `${averages.overall} `;
    document.getElementById('profileRating').textContent = averages.overall;
    
    // Update category ratings
    document.querySelector('.stat-item:nth-child(1) .stat-fill').style.width = `${averages.professionalism * 20}%`;
    document.querySelector('.stat-item:nth-child(1) span').textContent = averages.professionalism;
    
    document.querySelector('.stat-item:nth-child(2) .stat-fill').style.width = `${averages.quality * 20}%`;
    document.querySelector('.stat-item:nth-child(2) span').textContent = averages.quality;
    
    document.querySelector('.stat-item:nth-child(3) .stat-fill').style.width = `${averages.communication * 20}%`;
    document.querySelector('.stat-item:nth-child(3) span').textContent = averages.communication;
    
    // Render individual reviews
    reviewsList.innerHTML = '';
    
    if (reviews.length === 0) {
      reviewsList.innerHTML = '<p class="empty-text">No reviews yet</p>';
      return;
    }
    
    reviews.forEach(review => {
      const reviewEl = document.createElement('div');
      reviewEl.className = 'review-card';
      reviewEl.innerHTML = `
        <div class="review-header">
          <img src="${review.user.avatar}" alt="${review.user.name}">
          <div>
            <h4>${review.user.name}</h4>
            <div class="review-date">${review.date}</div>
          </div>
          <div class="review-rating">
            ${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}
          </div>
        </div>
        <h3>${review.title}</h3>
        <div class="review-content">
          <p>${review.content}</p>
        </div>
        <div class="review-categories">
          <div><strong>Professionalism:</strong> ${review.categories.professionalism}/5</div>
          <div><strong>Quality:</strong> ${review.categories.quality}/5</div>
          <div><strong>Communication:</strong> ${review.categories.communication}/5</div>
        </div>
      `;
      reviewsList.appendChild(reviewEl);
    });
  }
  
  // Initial render
  renderReviews();
});</script>
</body>
</html>
