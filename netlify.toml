# Netlify Configuration for SkillHub ZA React Application

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Current public Django backend. Replace with a permanent deployment
  # (Render/Railway/Fly) when available; a Netlify dashboard variable with
  # the same name overrides this value.
  VITE_API_BASE_URL = "https://engrainedly-subinvolute-silvana.ngrok-free.dev/api/"

# SPA Fallback: Direct all browser routes to index.html with 200 OK
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
